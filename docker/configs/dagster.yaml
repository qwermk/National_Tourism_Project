# =============================================================================
# Dagster instance configuration
# =============================================================================

# Almacenamiento de ejecuciones
storage:
  sqlite:
    base_dir: /opt/dagster/dagster_home/storage

# Almacenamiento de schedules
scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

# Configuración del run launcher
run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# Configuración de logs
compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/dagster_home/logs

# Telemetría desactivada
telemetry:
  enabled: false
