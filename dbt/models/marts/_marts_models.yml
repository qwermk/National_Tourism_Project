version: 2

models:
  - name: fct_tourism_arrivals
    description: "Fact table de llegadas de turistas internacionales a Colombia."
    columns:
      - name: arrival_id
        description: "Clave surrogate única."
        tests:
          - unique
          - not_null
      - name: year
        description: "Año del periodo."
        tests:
          - not_null
      - name: total_visitors
        description: "Total de visitantes en el periodo."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: fct_hotel_occupancy
    description: "Fact table de ocupación hotelera mensual por departamento."
    columns:
      - name: occupancy_id
        description: "Clave surrogate única."
        tests:
          - unique
          - not_null
      - name: occupancy_rate
        description: "Porcentaje de ocupación."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100

  - name: dim_departments
    description: "Dimensión de departamentos de Colombia."
    columns:
      - name: dane_code
        description: "Código DANE del departamento."
        tests:
          - unique
          - not_null
      - name: department
        description: "Nombre del departamento."
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Dimensión de fechas para análisis de series temporales (2019–2026)."
    columns:
      - name: date_day
        description: "Fecha del día (clave primaria)."
        tests:
          - unique
          - not_null
      - name: year
        description: "Año de la fecha."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 2019
              max_value: 2026
      - name: month
        description: "Mes de la fecha (1–12)."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 12
      - name: quarter
        description: "Trimestre (Q1–Q4)."
        tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']

  # ------------------------------------------------------------------
  # NUEVOS MODELOS
  # ------------------------------------------------------------------
  - name: fct_tourism_gdp
    description: "Fact table de PIB turístico de Colombia (datos anuales del DANE)."
    columns:
      - name: gdp_id
        description: "Clave surrogate única."
        tests:
          - unique
          - not_null
      - name: year
        description: "Año del registro."
        tests:
          - not_null
      - name: tourism_gdp_billions_cop
        description: "PIB turístico en billones de pesos colombianos."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: fct_migration_flows
    description: "Fact table de flujos migratorios de Colombia."
    columns:
      - name: migration_id
        description: "Clave surrogate única."
        tests:
          - unique
          - not_null
      - name: nationality
        description: "Nacionalidad del viajero."
        tests:
          - not_null
      - name: movement_type
        description: "Tipo: entrada o salida."
        tests:
          - not_null
          - accepted_values:
              values: ["entrada", "salida"]
      - name: number_of_travelers
        description: "Cantidad de viajeros."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: fct_world_bank_comparison
    description: "Fact table de comparación regional de turismo (World Bank)."
    columns:
      - name: comparison_id
        description: "Clave surrogate única."
        tests:
          - unique
          - not_null
      - name: country_code
        tests:
          - not_null
      - name: indicator_code
        tests:
          - not_null
      - name: value
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: fct_air_passengers
    description: "Fact table de pasajeros aéreos mensuales por aeropuerto."
    columns:
      - name: passenger_id
        description: "Clave surrogate única."
        tests:
          - unique
          - not_null
      - name: airport
        tests:
          - not_null
      - name: total_passengers
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: fct_tourism_balance
    description: "Fact table de balanza turística trimestral (Banco de la República)."
    columns:
      - name: balance_id
        description: "Clave surrogate única."
        tests:
          - unique
          - not_null
      - name: year
        tests:
          - not_null
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
      - name: tourism_income_usd_millions
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
