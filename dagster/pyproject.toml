[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "national-tourism"
version = "0.1.0"
description = "Pipeline de datos de turismo nacional de Colombia — Modern Data Stack local"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "dagster-duckdb>=0.23",
    "dagster-dbt>=0.23",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "boto3>=1.34",
    "minio>=7.2",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "dagster-webserver>=1.7",
]

[tool.setuptools.packages.find]
include = ["national_tourism*"]

[tool.dagster]
module_name = "national_tourism.definitions"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
