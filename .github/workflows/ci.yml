# =============================================================================
# CI/CD — GitHub Actions
# =============================================================================
# Pipeline que ejecuta en cada push/PR a main o develop:
#
#   lint        → ruff check + format (Python)
#   dbt-test    → dbt deps + compile + seed + test (requiere: lint)
#   dagster-test → pytest con coverage (requiere: lint)
#   docker-build → docker build --no-push (requiere: dbt-test + dagster-test)
# =============================================================================

name: CI — National Tourism Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # -----------------------------------------------------------------
  # Job 1: Lint & format check
  # -----------------------------------------------------------------
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.3"

      - name: ruff check
        run: ruff check dagster/

      - name: ruff format check
        run: ruff format --check dagster/

  # -----------------------------------------------------------------
  # Job 2: dbt compile + seed + schema tests
  # -----------------------------------------------------------------
  dbt-test:
    name: "dbt Compile & Test"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt + adapter
        run: pip install "dbt-core>=1.8" "dbt-duckdb>=1.8"

      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/packages.yml') }}

      - name: dbt deps
        working-directory: dbt
        run: dbt deps --profiles-dir .

      - name: dbt parse (generate manifest)
        working-directory: dbt
        run: dbt parse --profiles-dir .

      - name: dbt compile
        working-directory: dbt
        run: dbt compile --profiles-dir . --target local

      - name: dbt seed
        working-directory: dbt
        run: dbt seed --profiles-dir . --target local

      - name: dbt test — schema tests
        working-directory: dbt
        run: dbt test --profiles-dir . --target local --select "test_type:schema"

      - name: Upload dbt manifest
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: dbt/target/manifest.json
          retention-days: 7

  # -----------------------------------------------------------------
  # Job 3: Dagster unit tests + coverage
  # -----------------------------------------------------------------
  dagster-test:
    name: "Dagster Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project + dev dependencies
        run: pip install -e "dagster/.[dev]" pytest-cov

      - name: Install dbt (needed for manifest generation in conftest)
        run: pip install "dbt-core>=1.8" "dbt-duckdb>=1.8"

      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/packages.yml') }}

      - name: dbt deps
        working-directory: dbt
        run: dbt deps --profiles-dir .

      - name: Run pytest with coverage
        working-directory: dagster
        run: |
          pytest tests/ -v \
            --cov=national_tourism \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: dagster/coverage.xml
          retention-days: 7

  # -----------------------------------------------------------------
  # Job 4: Docker build (sin push — solo valida que construye)
  # -----------------------------------------------------------------
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [dbt-test, dagster-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dagster image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dagster
          push: false
          tags: national-tourism/dagster:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
